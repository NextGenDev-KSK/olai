name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the workflow token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo tooling
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-llvm-cov --locked

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Rust clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Frontend tests + coverage (>=90%)
        run: npm run test:coverage

      - name: Rust tests + coverage (>=90%)
        run: npm run coverage:rust

      - name: End-to-end (Playwright)
        run: npm run test:e2e

      - name: Dependency audit (JS, high+)
        run: npm run audit:js

      - name: Dependency audit (Rust)
        run: npm run audit:rust

      - name: Frontend build
        run: npm run build

  bundle:
    name: Tauri bundle (installer)
    runs-on: windows-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install npm dependencies
        run: npm ci
      - name: Build Tauri installer (MSI + NSIS)
        run: npm run tauri build
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: olai-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
